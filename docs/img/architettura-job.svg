<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-label="pg_cron di Supabase lancia con l'API di GitHub sei job in GitHub Actions. Cinque job scrivono file JSON sul ramo main, che viene pubblicato su GitHub Pages e arriva all'app. Il job Notifiche push legge quei file e le iscrizioni su Supabase e invia le notifiche tramite i servizi push di Apple, Google e Mozilla.">
          <defs><style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--fg:#10161F;--fg2:#2C3542;--muted:#5A6472;--line:#DDE2E8;--accent:#C2410C;--accent-soft:#FDEDE5;--navy:#1E2B4A;--navy-soft:#E6EAF3;--ok:#1F7A4D;--ok-soft:#E3F3EA;--ext-soft:#F1F2F4}
@media (prefers-color-scheme: dark){:root{--bg:#0F141B;--surface:#18202A;--fg:#E8EDF3;--fg2:#C9D2DD;--muted:#9AA6B6;--line:#2A3542;--accent:#F0743F;--accent-soft:#3A2116;--navy:#9DB2E0;--navy-soft:#1C2740;--ok:#6FCF9B;--ok-soft:#173226;--ext-soft:#1A212B}}
.sfondo{fill:var(--bg)}
.z-tel{fill:var(--accent-soft);stroke:var(--accent)}.z-gh{fill:var(--navy-soft);stroke:var(--navy)}.z-sb{fill:var(--ok-soft);stroke:var(--ok)}.z-ext{fill:var(--ext-soft);stroke:var(--muted);stroke-dasharray:5 4}
.z-tel,.z-gh,.z-sb,.z-ext{stroke-width:1.5}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
text{font-family:Barlow,"Helvetica Neue",Arial,sans-serif}
.zt{font:700 17px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.zt.tel{fill:var(--accent)}.zt.gh{fill:var(--navy)}.zt.sb{fill:var(--ok)}.zt.ext{fill:var(--muted)}
.bt{font-weight:600;font-size:13.5px;fill:var(--fg)}.bs{font-size:12px;fill:var(--muted)}
.lb{font-weight:500;font-size:11.5px;fill:var(--fg2)}.lb.acc{fill:var(--accent);font-weight:600}
.ar{stroke:var(--fg2);stroke-width:1.4;fill:none}.ar.acc{stroke:var(--accent);stroke-width:2}.ar.dash{stroke-dasharray:4 3}
.mk{fill:var(--fg2)}.mk.acc{fill:var(--accent)}
</style>
            <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="m2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk acc" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs><rect class="sfondo" x="0" y="0" width="1040" height="600" rx="12"/>
          <!-- Supabase -->
          <rect class="z-sb" x="20" y="20" width="210" height="560" rx="14"/>
          <text class="zt sb" x="36" y="46">Supabase</text>
          <rect class="box" x="34" y="60" width="182" height="176" rx="10"/>
          <text class="bt" x="48" y="84">pg_cron (ora di Roma)</text>
          <text class="bs" x="48" y="106">5:23 gare seguite</text>
          <text class="bs" x="48" y="124">5:53 schede gara</text>
          <text class="bs" x="48" y="142">ogni ora :50 novità</text>
          <text class="bs" x="48" y="160">:07 e :37 notifiche</text>
          <text class="bs" x="48" y="178">6:41 e 17:41 contenuti</text>
          <text class="bs" x="48" y="196">lunedì 6:17 calendario</text>
          <text class="bs" x="48" y="222">orari fissi in UTC</text>
          <rect class="box" x="34" y="262" width="182" height="54" rx="10"/>
          <text class="bt" x="48" y="285">Vault</text>
          <text class="bs" x="48" y="304">token GitHub (DISPATCH)</text>
          <line class="ar" x1="125" y1="260" x2="125" y2="239" marker-end="url(#m2)"/>
          <rect class="box" x="34" y="430" width="182" height="110" rx="10"/>
          <text class="bt" x="48" y="454">Database</text>
          <text class="bs" x="48" y="474">gare_aggiunte</text>
          <text class="bs" x="48" y="492">push_iscrizioni (+ stato)</text>
          <text class="bs" x="48" y="510">invii (contatori)</text>

          <!-- innesco -->
          <line class="ar acc" x1="218" y1="148" x2="328" y2="148" marker-end="url(#m2a)"/>
          <text class="lb acc" x="273" y="132" text-anchor="middle">lancia il job</text>
          <text class="lb acc" x="273" y="168" text-anchor="middle">API GitHub</text>

          <!-- Actions -->
          <rect class="z-gh" x="330" y="20" width="260" height="560" rx="14"/>
          <text class="zt gh" x="346" y="46">GitHub Actions</text>
          <rect class="box" x="346" y="60" width="228" height="56" rx="10"/>
          <text class="bt" x="360" y="83">Esporta gare seguite</text><text class="bs" x="360" y="102">da: Supabase, gare_aggiunte</text>
          <rect class="box" x="346" y="128" width="228" height="56" rx="10"/>
          <text class="bt" x="360" y="151">Schede gara · Claude Code</text><text class="bs" x="360" y="170">da: gare seguite + siti ufficiali</text>
          <rect class="box" x="346" y="196" width="228" height="56" rx="10"/>
          <text class="bt" x="360" y="219">Novità delle gare</text><text class="bs" x="360" y="238">da: feed dei siti, YouTube, riviste</text>
          <rect class="box" x="346" y="264" width="228" height="56" rx="10"/>
          <text class="bt" x="360" y="287">Contenuti</text><text class="bs" x="360" y="306">da: feed, video, podcast in italiano</text>
          <rect class="box" x="346" y="332" width="228" height="56" rx="10"/>
          <text class="bt" x="360" y="355">Calendario gare</text><text class="bs" x="360" y="374">da: FIDAL (iCal e PDF)</text>
          <rect class="box" x="346" y="440" width="228" height="76" rx="10"/>
          <text class="bt" x="360" y="463">Notifiche push</text>
          <text class="bs" x="360" y="482">regole di non disturbo + meteo</text>
          <text class="bs" x="360" y="500">riepilogo "Invii notifiche"</text>
          <text class="bs" x="346" y="560">ogni job è in coda con sé stesso</text>

          <!-- job ↔ database -->
          <line class="ar" x1="232" y1="478" x2="344" y2="478" marker-start="url(#m2)" marker-end="url(#m2)"/>
          <text class="lb" x="288" y="462" text-anchor="middle">iscrizioni</text>
          <text class="lb" x="288" y="496" text-anchor="middle">stato, invii</text>

          <!-- Repo -->
          <rect class="z-gh" x="660" y="20" width="190" height="380" rx="14"/>
          <text class="zt gh" x="676" y="46">Repo · main</text>
          <rect class="box" x="676" y="60" width="158" height="56" rx="10"/><text class="bs" x="690" y="93">data/gare_seguite.json</text>
          <rect class="box" x="676" y="128" width="158" height="56" rx="10"/><text class="bs" x="690" y="161">content/schede.json</text>
          <rect class="box" x="676" y="196" width="158" height="56" rx="10"/><text class="bs" x="690" y="229">data/novita_gare.json</text>
          <rect class="box" x="676" y="264" width="158" height="56" rx="10"/><text class="bs" x="690" y="297">data/contenuti.json</text>
          <rect class="box" x="676" y="332" width="158" height="56" rx="10"/><text class="bs" x="690" y="365">data/gare.json</text>
          <line class="ar" x1="576" y1="88" x2="674" y2="88" marker-end="url(#m2)"/>
          <line class="ar" x1="576" y1="156" x2="674" y2="156" marker-end="url(#m2)"/>
          <line class="ar" x1="576" y1="224" x2="674" y2="224" marker-end="url(#m2)"/>
          <line class="ar" x1="576" y1="292" x2="674" y2="292" marker-end="url(#m2)"/>
          <line class="ar" x1="576" y1="360" x2="674" y2="360" marker-end="url(#m2)"/>
          <text class="lb" x="625" y="80" text-anchor="middle">commit</text>
          <text class="lb" x="625" y="148" text-anchor="middle">commit</text>
          <text class="lb" x="625" y="216" text-anchor="middle">commit</text>
          <text class="lb" x="625" y="284" text-anchor="middle">commit</text>
          <text class="lb" x="625" y="352" text-anchor="middle">commit</text>
          <path class="ar dash" d="M700,402 L578,446" marker-end="url(#m2)"/>
          <text class="lb" x="706" y="430">legge schede, novità,</text>
          <text class="lb" x="706" y="445">contenuti</text>

          <!-- Pages e telefono -->
          <rect class="z-gh" x="880" y="150" width="140" height="100" rx="14"/>
          <text class="zt gh" x="894" y="176">Pages</text>
          <text class="bs" x="894" y="198">"Pubblica web app"</text>
          <text class="bs" x="894" y="216">a ogni push su main</text>
          <line class="ar" x1="852" y1="200" x2="878" y2="200" marker-end="url(#m2)"/>
          <line class="ar" x1="950" y1="252" x2="950" y2="438" marker-end="url(#m2)"/>
          <text class="lb" x="958" y="340">app e dati</text>
          <text class="lb" x="958" y="355">aggiornati</text>
          <rect class="z-tel" x="880" y="440" width="140" height="76" rx="14"/>
          <text class="zt tel" x="894" y="466">Telefono</text>
          <text class="bs" x="894" y="488">app aggiornata</text>
          <text class="bs" x="894" y="504">+ notifica</text>

          <!-- push -->
          <rect class="z-ext" x="676" y="450" width="174" height="66" rx="14"/>
          <text class="bt" x="690" y="474">Servizi push</text>
          <text class="bs" x="690" y="494">Apple, Google, Mozilla</text>
          <line class="ar" x1="576" y1="483" x2="674" y2="483" marker-end="url(#m2)"/>
          <text class="lb" x="625" y="475" text-anchor="middle">Web Push</text>
          <line class="ar" x1="852" y1="483" x2="878" y2="483" marker-end="url(#m2)"/>
        </svg>