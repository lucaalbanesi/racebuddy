# Assistenza: rende di nuovo amministratore un membro di un gruppo (per esempio dopo "Cancella tutti i miei dati").
# Senza "membro" elenca solo i membri del gruppo (nome, ruolo, quando è entrato) per scegliere l'id giusto.
# Con "superadmin" il telefono di quel membro diventa superamministratore (docs/supabase_superadmin.sql): admin ovunque e
# libero di spostarsi in qualunque gruppo da Io → Strumenti di prova.
name: Amministratore del gruppo (assistenza)
on:
  workflow_dispatch:
    inputs:
      gruppo:
        description: "Nome del gruppo (anche solo una parte)"
        required: true
      membro:
        description: "Id del membro da nominare amministratore (vuoto = solo elenco)"
        required: false
        default: ""
      superadmin:
        description: "Rendi superamministratore il telefono di questo membro"
        type: boolean
        default: false
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Progetto Supabase
        run: echo "REF=$(grep -o 'https://[a-z0-9]*\.supabase\.co' app/config.js | sed 's#https://##; s#\.supabase\.co##')" >> $GITHUB_ENV
      - name: Elenco o nomina
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GRUPPO: ${{ inputs.gruppo }}
          MEMBRO: ${{ inputs.membro }}
          SUPER: ${{ inputs.superadmin }}
        run: |
          [[ "$GRUPPO" =~ ^[A-Za-z0-9\ ._-]{2,60}$ ]] || { echo "::error::nome del gruppo non valido"; exit 1; }
          if [ -n "$MEMBRO" ]; then
            [[ "$MEMBRO" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::id del membro non valido"; exit 1; }
            q="update public.membri m set ruolo = 'admin' from public.gruppi g where m.id = '$MEMBRO' and g.id = m.gruppo_id and g.nome ilike '%$GRUPPO%' returning g.nome as gruppo, m.nome, m.ruolo;"
            if [ "$SUPER" = "true" ]; then
              q="with s as (insert into public.superadmin (token_hash, nota) select m.token_hash, m.nome from public.membri m join public.gruppi g on g.id = m.gruppo_id where m.id = '$MEMBRO' and g.nome ilike '%$GRUPPO%' on conflict (token_hash) do update set nota = excluded.nota returning nota) select nota as superamministratore from s;"
            fi
          else
            q="select g.nome as gruppo, g.classifiche, m.id, m.nome, m.ruolo, m.creato::date as entrato, m.visto from public.gruppi g left join public.membri m on m.gruppo_id = g.id where g.nome ilike '%$GRUPPO%' order by g.nome, m.creato desc;"
          fi
          body=$(jq -n --arg q "$q" '{query: $q}')
          code=$(curl -s -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data "$body")
          if [ "${code:0:1}" != "2" ]; then echo "::error::query non riuscita (HTTP $code): $(head -c 400 out.json)"; exit 1; fi
          righe=$(jq -r 'if length == 0 then "nessuna riga" else map(to_entries | map("\(.key)=\(.value)") | join(" · ")) | join(" || ") end' out.json)
          echo "::notice title=Gruppo::$righe"
