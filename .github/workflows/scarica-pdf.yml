name: Scarica PDF calendario maratone (diagnostica)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/raw
          curl -sSL -A "Mozilla/5.0 RaceBuddy" -o data/raw/maratone_2027.pdf "https://www.fidal.it/upload/files/Organizzazione/2027/Maratone%20e%20mezze%20maratone/Calendario%20Maratone%20e%20Mezze%20Maratone%202027%20agg.%2029%20settembre.pdf"
          curl -sSL -A "Mozilla/5.0 RaceBuddy" -o data/raw/news_2027.html "https://www.fidal.it/content/Maratone-e-mezze-219-eventi-nel-2027/186849"
          file data/raw/*
          git config user.name "racebuddy-bot"; git config user.email "racebuddy-bot@users.noreply.github.com"
          git add data/raw && git commit -m "Diagnostica: PDF calendario maratone 2027" && git push
