name: Esplora (temporaneo)
on:
  push:
    branches: [esplora-endu]
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - name: FIDAL
        run: |
          set +e
          exec > >(tee esito.txt) 2>&1
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          curl -sL -A "$UA" "https://www.fidal.it/result.php?id_sito=1&cerca=alberto+crippa" -o r.html
          python3 -c "
          import re
          t=open('r.html',encoding='utf-8',errors='ignore').read()
          rows=re.findall(r'(?s)<tr.*?</tr>',t)
          for r in rows[:12]:
            l=re.findall(r'href=\"(https://www.fidal.it/atleta/[^\"]+)\"',r); c=[re.sub(r'<[^>]+>|\s+',' ',x).strip() for x in re.findall(r'(?s)<td.*?</td>',r)]
            print(c, l[:1])" | tee righe.txt
          for A in https://www.fidal.it/atleta/Alberto-Crippa/dq2RmJufa2o%3D https://www.fidal.it/atleta/Alberto-Crippa/dq2RlZmnbWU%3D; do
            echo "=== $A"; curl -sL -A "$UA" "$A" -o at.html
            python3 -c "
          import re,html
          t=open('at.html',encoding='utf-8',errors='ignore').read()
          print('tabelle',t.count('<table'))
          for h in re.findall(r'(?s)<h[2-4][^>]*>(.*?)</h[2-4]>',t)[:20]: print('H:',re.sub(r'<[^>]+>|\s+',' ',h).strip())
          t=re.sub(r'(?s)<(script|style).*?</\\1>','',t);t=re.sub(r'<[^>]+>',' | ',t);t=html.unescape(re.sub(r'\s+',' ',t));t=re.sub(r'( \| )+',' | ',t)
          i=t.find('Primati'); print(t[i:i+1400] if i>=0 else 'NESSUN PRIMATO')
          for k in ['Maratona','Mezza','10 Km','Km 10','Strada']: print(k,t.count(k))"
          done
      - name: Esito come annotazioni
        if: always()
        run: |
          split -b 3500 -d esito.txt parte_
          for f in parte_*; do m=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f"); echo "::notice title=$f::$m"; done
