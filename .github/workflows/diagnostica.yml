name: Diagnostica FIDAL
on: { push: { branches: [diagnostica] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python diag/diag.py
      - run: |
          git config user.name racebuddy-bot; git config user.email racebuddy-bot@users.noreply.github.com
          git add diag/risultato.txt; git commit -m "diagnostica"; git push
