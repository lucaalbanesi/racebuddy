name: Esplora (temporaneo)
on:
  push:
    branches: [esplora-endu]
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - name: FIDAL
        run: |
          set +e
          exec > >(tee esito.txt) 2>&1
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          echo "== robots.txt"; curl -sL -A "$UA" https://www.fidal.it/robots.txt | head -60
          curl -sL -A "$UA" https://www.fidal.it/ -o home.html; echo "home $(wc -c < home.html)"
          echo "== link con atlet/risultat/graduator/primat"
          grep -oiE 'href="[^"]*(atlet|risultat|graduator|primat|classific)[^"]*"' home.html | sort -u | head -40
          echo "== termini / note legali"
          grep -oiE 'href="[^"]*(legal|termini|condizioni|copyright|disclaimer)[^"]*"' home.html | sort -u | head -10
      - name: Esito come annotazioni
        if: always()
        run: |
          split -b 3500 -d esito.txt parte_
          for f in parte_*; do m=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f"); echo "::notice title=$f::$m"; done
