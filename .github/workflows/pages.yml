name: Pubblica web app

on:
  push:
    branches: [main]
    paths: ["app/**", "content/**", "data/**", "tests/test_logic.js", ".github/workflows/pages.yml"]
  workflow_run:
    # i job che fanno il commit con il token di GitHub non fanno partire il push: si pubblica quando finiscono
    workflows: ["Aggiorna calendario gare", "Schede gara", "Gare estere", "Catalogo scarpe", "Aggiorna contenuti", "Esporta gare seguite", "Verifica fonti contenuti"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test della logica
        run: node tests/test_logic.js
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp -r app/* _site/
          cp -r content data _site/
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
