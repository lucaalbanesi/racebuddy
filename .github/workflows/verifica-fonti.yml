name: Verifica fonti tempi (prova)
on:
  push:
    branches: [verifica-fonti]
permissions:
  contents: write
jobs:
  sonda:
    if: "!contains(github.event.head_commit.message, '[esito]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limite ricerche MarathonView
        run: |
          mkdir -p out
          exec > >(tee out/esito.txt) 2>&1
          UA="Mozilla/5.0 (RaceBuddy verifica fonti)"
          U="https://marathonview.net/marathon-results-of-Lorenzo-Lotti"
          echo "--- senza cookie, 6 volte"
          for i in 1 2 3 4 5 6; do curl -sS -A "$UA" -o p.html -w "HTTP %{http_code} " "$U"; python3 verifica_conta.py p.html; sleep 2; done
          echo "--- con cookie conservati, 6 volte"
          for i in 1 2 3 4 5 6; do curl -sS -A "$UA" -c jar -b jar -o p.html -w "HTTP %{http_code} " "$U"; python3 verifica_conta.py p.html; sleep 2; done
          echo "--- nomi dei cookie:"; grep -v '^#' jar | awk 'NF{print $6}'
      - name: Salva l'esito sul ramo
        run: |
          mkdir -p verifica && cp out/esito.txt verifica/esito.txt
          true
          git config user.name "Luca Albanesi"; git config user.email "luca.alba8@gmail.com"
          git add verifica && git commit -m "Esito sonda [esito]" && git push
