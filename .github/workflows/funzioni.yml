name: Pubblica funzioni Supabase
# Pubblica le Edge Functions "strava" e "tempi" sul progetto Supabase. Serve il secret SUPABASE_ACCESS_TOKEN
# (Supabase → Account → Access Tokens). I segreti di Strava stanno in Supabase, non qui (docs/login-strava.md).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml", "tests/test_strava.mjs", "tests/test_tempi.mjs", "tests/fixtures/tempi/**", ".github/workflows/funzioni.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  funzioni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test della funzione strava
        run: node tests/test_strava.mjs
      - name: Test della funzione tempi
        run: node tests/test_tempi.mjs
      - name: Progetto Supabase
        run: echo "REF=$(grep -o 'https://[a-z0-9]*\.supabase\.co' app/config.js | sed 's#https://##; s#\.supabase\.co##')" >> $GITHUB_ENV
      - name: Controllo del token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::Manca il secret SUPABASE_ACCESS_TOKEN: funzione non pubblicata (vedi docs/login-strava.md)"; echo "SALTA=1" >> $GITHUB_ENV; fi
      - uses: supabase/setup-cli@v1
        if: env.SALTA != '1'
        with:
          version: 2.20.5
      - name: Segreti di Strava (dai GitHub Secrets, se ci sono)
        if: env.SALTA != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          if [ -n "$STRAVA_CLIENT_ID" ] && [ -n "$STRAVA_CLIENT_SECRET" ]; then
            supabase secrets set --project-ref "$REF" STRAVA_CLIENT_ID="$STRAVA_CLIENT_ID" STRAVA_CLIENT_SECRET="$STRAVA_CLIENT_SECRET"
            echo "Segreti di Strava impostati sul progetto $REF"
          else
            echo "::notice::STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET non sono nei GitHub Secrets: restano quelli impostati in Supabase"
          fi
      - name: Pubblica "strava"
        if: env.SALTA != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy strava --project-ref "$REF" --no-verify-jwt
      - name: Pubblica "tempi"
        if: env.SALTA != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy tempi --project-ref "$REF" --no-verify-jwt
      - name: Prova "tempi" dal vivo (un atleta pubblico)
        if: env.SALTA != '1'
        run: |
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' app/config.js)
          R=$(curl -s --max-time 60 -X POST "https://$REF.supabase.co/functions/v1/tempi" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"nome":"Yemaneberhan","cognome":"Crippa"}')
          SINTESI=$(echo "$R" | python3 -c "import json,sys
          j=json.load(sys.stdin); p=j.get('persone',[])
          print('fonti', j.get('fonti'), '| persone', len(p), '| risultati', sum(len(x['risultati']) for x in p), '| maratone', sum(1 for x in p for r in x['risultati'] if r['distanza']=='42'))" 2>&1 || echo "risposta non valida: ${R:0:200}")
          echo "$SINTESI"
          case "$SINTESI" in *"'gpl': 'ok'"*"'fidal': 'ok'"*) echo "::notice title=Funzione tempi::$SINTESI";; *) echo "::warning title=Funzione tempi::$SINTESI";; esac
