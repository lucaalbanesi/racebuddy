name: Esplora (temporaneo)
on:
  push:
    branches: [esplora-endu]
permissions:
  contents: write
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica pagine di esempio
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36 RaceBuddy"
          D=fixtures; rm -rf $D; mkdir -p $D; g() { curl -sL -A "$UA" --max-time 40 -o "$D/$1" -w "$1 %{http_code} %{size_download}\n" "$2"; sleep 2; }
          g cal_gpl.html "https://www.garepodistichelazio.it/gare-lazio.php"
          g cal_gpl_2027.html "https://www.garepodistichelazio.it/gare-anno-successivo.php?tipo=0"
          g cal_gpl_info.html "https://www.garepodistichelazio.it/info-gara-Rome-Half-Marathon"
      - name: Salva nel ramo
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fixtures && git commit -qm "Pagine di esempio calendario" && git push -q
