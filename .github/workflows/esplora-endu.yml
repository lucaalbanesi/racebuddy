name: Esplora (temporaneo)
on:
  push:
    branches: [esplora-endu]
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - name: FIDAL
        run: |
          set +e
          exec > >(tee esito.txt) 2>&1
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          curl -sL -A "$UA" "https://www.fidal.it/lista_atleti.php?h=1" -o lista.html
          echo "== link non atleta in lista"; grep -oiE 'href="[^"]*lista_atleti[^"]*"' lista.html | sort -u | head -20
          grep -oiE '(name|id)="[^"]*(cogn|nome|lettera|search|cerca)[^"]*"' lista.html | sort -u
          grep -oiE '\$\.(get|post|ajax)\([^)]{0,200}' lista.html | head
          echo "== result.php"; curl -sL -A "$UA" "https://www.fidal.it/result.php?id_sito=1&cerca=crippa" -o r.html
          python3 -c "
          import re,html
          t=open('r.html',encoding='utf-8',errors='ignore').read()
          print(sorted(set(re.findall(r'href=\"([^\"]*(?:atlet|lista)[^\"]*)\"',t)))[:15])
          t=re.sub(r'(?s)<(script|style).*?</\\1>','',t);t=re.sub(r'<[^>]+>',' ',t);t=html.unescape(re.sub(r'\s+',' ',t))
          i=t.lower().find('crippa'); print(t[max(0,i-300):i+600])"
      - name: Esito come annotazioni
        if: always()
        run: |
          split -b 3500 -d esito.txt parte_
          for f in parte_*; do m=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f"); echo "::notice title=$f::$m"; done
