name: Test database gruppo
on:
  push:
    paths: ["docs/supabase*.sql", "tests/test_*.sql", ".github/workflows/test-db.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: prova
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: prova
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ruoli come su Supabase
        run: psql -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin; grant usage on schema public to anon, authenticated, service_role; create schema extensions;"
      - name: Schema del gruppo
        run: psql -v ON_ERROR_STOP=1 -f docs/supabase_gruppo.sql
      - name: Prove
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/test_gruppo.sql > esito.txt 2>&1 || true
          cat esito.txt
          if ! grep -q "permessi ok" esito.txt; then echo "::error::$(grep -iE 'error|errore|assert|context|line' esito.txt | head -6 | tr '\n' ' ')"; exit 1; fi
      - name: Classifiche (fase 1)
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/supabase_classifiche.sql
          psql -v ON_ERROR_STOP=1 -f docs/supabase_classifiche.sql   # ripetibile
          psql -v ON_ERROR_STOP=1 -f tests/test_classifiche.sql > esito7.txt 2>&1 || true
          cat esito7.txt
          if ! grep -q "permessi classifiche ok" esito7.txt; then echo "::error::classifiche: $(grep -iE 'error|errore|assert|context|line' esito7.txt | head -6 | tr '\n' ' ')"; exit 1; fi
      - name: Superamministratore
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/supabase_superadmin.sql
          psql -v ON_ERROR_STOP=1 -f docs/supabase_superadmin.sql   # ripetibile
          psql -v ON_ERROR_STOP=1 -f tests/test_superadmin.sql > esito8.txt 2>&1 || true
          cat esito8.txt
          if ! grep -q "permessi superadmin ok" esito8.txt; then echo "::error::superadmin: $(grep -iE 'error|errore|assert|context|line' esito8.txt | head -6 | tr '\n' ' ')"; exit 1; fi
      - name: Statistiche
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/supabase.sql
          psql -v ON_ERROR_STOP=1 -c "create table public.gare_aggiunte (id bigserial primary key, gara_id text not null, nome text, data date, luogo text, distanza text, fonte text, creato timestamptz not null default now());"
          psql -v ON_ERROR_STOP=1 -f docs/supabase_buddy.sql          # tabelle del Buddy, prima delle statistiche
          psql -v ON_ERROR_STOP=1 -f docs/supabase_statistiche.sql
          psql -v ON_ERROR_STOP=1 -f docs/supabase_statistiche.sql   # ripetibile
          psql -v ON_ERROR_STOP=1 -f docs/supabase_buddy.sql          # ripetibile
          psql -v ON_ERROR_STOP=1 -f tests/test_statistiche.sql > esito3.txt 2>&1 || true
          cat esito3.txt
          if ! grep -q "permessi statistiche ok" esito3.txt; then echo "::error::statistiche: $(grep -iE 'error|errore|assert|context|line' esito3.txt | head -6 | tr '\n' ' ')"; exit 1; fi
      - name: Buddy
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/test_buddy.sql > esito6.txt 2>&1 || true
          cat esito6.txt
          if ! grep -q "permessi buddy ok" esito6.txt; then echo "::error::buddy: $(grep -iE 'error|errore|assert|context|line' esito6.txt | head -6 | tr '\n' ' ')"; exit 1; fi
      - name: Strava
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/supabase_strava.sql
          psql -v ON_ERROR_STOP=1 -f docs/supabase_strava.sql   # ripetibile
          psql -v ON_ERROR_STOP=1 -f tests/test_strava.sql > esito5.txt 2>&1 || true
          cat esito5.txt
          if ! grep -q "permessi strava ok" esito5.txt; then echo "::error::strava: $(grep -iE 'error|errore|assert|context|line' esito5.txt | head -6 | tr '\n' ' ')"; exit 1; fi
      - name: Account (login, per ora spento)
        run: |
          # come su Supabase: schema auth, utenti, auth.uid() dal JWT (qui da request.jwt.claim.sub), ruolo authenticated
          psql -v ON_ERROR_STOP=1 -c "create schema auth; create table auth.users (id uuid primary key, email text); create function auth.uid() returns uuid language sql stable as \$\$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid \$\$; grant usage on schema auth to anon, authenticated; grant execute on function auth.uid() to anon, authenticated;"
          psql -v ON_ERROR_STOP=1 -f docs/supabase_account.sql
          psql -v ON_ERROR_STOP=1 -f docs/supabase_account.sql   # ripetibile
          psql -v ON_ERROR_STOP=1 -f tests/test_account.sql > esito4.txt 2>&1 || true
          cat esito4.txt
          if ! grep -q "permessi account ok" esito4.txt; then echo "::error::account: $(grep -iE 'error|errore|assert|context|line' esito4.txt | head -6 | tr '\n' ' ')"; exit 1; fi
      # La migrazione dei personali, applicata allo schema in produzione prima dei personali (f287bf8), deve dare lo stesso risultato.
      - name: Migrazione personali sullo schema in produzione
        run: |
          createdb vecchio
          psql -v ON_ERROR_STOP=1 -d vecchio -c "create schema extensions; grant usage on schema public to anon, authenticated;"
          git show f287bf8:docs/supabase_gruppo.sql | psql -v ON_ERROR_STOP=1 -q -d vecchio
          psql -v ON_ERROR_STOP=1 -d vecchio -c "select public.crea_gruppo(repeat('z', 40), 'Prima', 'Zeno');"
          psql -v ON_ERROR_STOP=1 -d vecchio -c "select public.pubblica_risultato(repeat('z', 40), '{\"distanza\":\"10\",\"data_gara\":\"2026-01-01\",\"tempo\":\"47:30\"}');"
          psql -v ON_ERROR_STOP=1 -d vecchio -f docs/supabase_gruppo_personali.sql
          psql -v ON_ERROR_STOP=1 -d vecchio -f docs/supabase_gruppo_personali.sql   # ripetibile
          test "$(psql -tA -d vecchio -c "select tempo from public.pb_membri")" = "0:47:30"
          psql -v ON_ERROR_STOP=1 -d vecchio -c "select public.esci_gruppo(repeat('z', 40));"
          psql -v ON_ERROR_STOP=1 -d vecchio -f tests/test_gruppo.sql > esito2.txt 2>&1 || true
          cat esito2.txt
          if ! grep -q "permessi ok" esito2.txt; then echo "::error::migrazione: $(grep -iE 'error|errore|assert|context|line' esito2.txt | head -6 | tr '\n' ' ')"; exit 1; fi
