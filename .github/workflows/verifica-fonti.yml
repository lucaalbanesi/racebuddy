name: Verifica fonti tempi (prova)
on:
  push:
    branches: [verifica-fonti]
permissions:
  contents: write
jobs:
  sonda:
    if: "!contains(github.event.head_commit.message, '[esito]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova API TDS
        run: |
          mkdir -p out && cd out
          exec > >(tee esito.txt) 2>&1
          B=https://api.tds.sport/rest/jrest.svc/0-TDS-Anonymous-TDS-0/it
          UA="Mozilla/5.0 (RaceBuddy verifica fonti)"
          g() { echo "=== GET $1"; curl -sS -m 30 -A "$UA" -H "Accept: application/json" -w "\nHTTP %{http_code}\n" "$B/$1" | head -c ${2:-3000}; echo; }
          D=$(date +%F)
          g "search/race/d/$D/r/-364/Roma/1/10/desc" 6000
          g "search/race/d/$D/r/-364/maratona/1/10/desc" 4000
          ID=$(curl -sS -A "$UA" "$B/search/race/d/$D/r/-364/Roma/1/10/desc" | jq -r '[..|objects|select(has("ID"))][0].ID' 2>/dev/null)
          echo "ID scelto: $ID"
          g "$ID/light" 4000
          g "$ID/rankings" 3000
          curl -sS -A "$UA" "$B/$ID/light" > light.json
          EV=$(jq -r '[..|objects|select(has("Events"))][0].Events[0].ID // empty' light.json)
          echo "EV: $EV"
          g "$ID/rankings/$EV" 4000
          curl -sS -A "$UA" "$B/$ID/rankings/$EV" > rk.json
          RID=$(jq -r '[..|objects|select(has("ID"))][0].ID // empty' rk.json)
          echo "RID: $RID"
          for sp in Arrivo 0 FINISH; do g "$ID/ranking/$RID/$EV/filter/Rossi/$sp/1/5" 2500; done
      - name: Salva l'esito sul ramo
        run: |
          mkdir -p verifica && cp out/esito.txt verifica/esito.txt
          cp out/*.json verifica/ 2>/dev/null || true
          git config user.name "Luca Albanesi"; git config user.email "luca.alba8@gmail.com"
          git add verifica && git commit -m "Esito sonda [esito]" && git push
