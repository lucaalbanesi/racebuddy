name: Esporta gare seguite
on:
  workflow_dispatch:
    # Innesco: pg_cron di Supabase (docs/supabase_cron.sql) con workflow_dispatch. Niente cron di GitHub: salta o ritarda i giri.
permissions:
  contents: write
# Un giro alla volta (salvano su main)
concurrency:
  group: seguite
  cancel-in-progress: false
jobs:
  esporta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/esporta_seguite.py
      - name: Salva se cambiato
        run: |
          git config user.name "racebuddy-bot"
          git config user.email "racebuddy-bot@users.noreply.github.com"
          git add data/gare_seguite.json
          git diff --cached --quiet || (git commit -m "Gare seguite aggiornate" && git push)
