name: Notifiche push
on:
  schedule:
    - cron: "7,37 3-20 * * *"   # ogni mezz'ora dalle 5 alle 22 circa (ora di Roma): mattino (mezz'ora prima dell'uscita), vigilia alle 19, mattina di gara
  workflow_dispatch:
    inputs:
      prova:
        description: "Invia subito a tutti gli iscritti (prova)"
        type: boolean
        default: false
jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test delle regole
        run: node tests/test_notifiche.js
      - run: npm install --no-save web-push@3.6.7
      - name: Invia
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PROVA: ${{ inputs.prova && '1' || '0' }}
        run: node scripts/invia_push.js
