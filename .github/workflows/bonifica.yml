name: Bonifica una tantum
# Applica a mano una bonifica dei dati (docs/supabase_bonifica_*.sql) sul database di Supabase e scrive l'esito
# come annotazione. Le bonifiche sono ripetibili: rilanciarle non fa danni.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "File della bonifica (docs/supabase_bonifica_*.sql)"
        required: true
jobs:
  bonifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Progetto Supabase
        run: echo "REF=$(grep -o 'https://[a-z0-9]*\.supabase\.co' app/config.js | sed 's#https://##; s#\.supabase\.co##')" >> $GITHUB_ENV
      - name: Applica
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILE: ${{ inputs.file }}
        run: |
          case "$FILE" in docs/supabase_bonifica_*.sql) ;; *) echo "::error::solo i file docs/supabase_bonifica_*.sql"; exit 1;; esac
          [ -f "$FILE" ] || { echo "::error::$FILE non esiste"; exit 1; }
          body=$(jq -Rs '{query: .}' < "$FILE")
          code=$(curl -s -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data "$body")
          if [ "${code:0:1}" != "2" ]; then echo "::error::bonifica non riuscita (HTTP $code): $(head -c 400 out.json)"; exit 1; fi
          echo "::notice title=Bonifica::$FILE → $(head -c 400 out.json)"
